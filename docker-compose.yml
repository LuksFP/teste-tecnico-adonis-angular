services:
  api:
    build: ./backend
    environment:
      TZ: UTC
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3333:3333"
    volumes:
      - db:/app/tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 12

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db:
